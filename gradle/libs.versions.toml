[versions]
kotlin = "2.4.10"
agp = "9.4.0"
android-compileSdk = "36"
# fseeko/ftello (used by Lua's io library) need API 24+ on 32-bit ABIs.
android-minSdk = "24"
androidx-test-runner = "1.7.0"
maven-publish = "0.37.0"

[libraries]
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
