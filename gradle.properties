# Applied to every project, so :lua-kmp and :android-jni always publish as a
# matched pair. This is the only place the version is written down; the release
# tag is expected to match it.
group=com.seanproctor
version=0.1.1

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true

kotlin.code.style=official
# The shared nativeMain source set uses the cinterop bindings directly.
kotlin.mpp.enableCInteropCommonization=true
# Apple targets cannot be built on Linux/Windows hosts; skip them quietly there.
kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true
